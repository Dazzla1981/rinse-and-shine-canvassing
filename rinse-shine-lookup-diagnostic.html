<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rinse & Shine — Lookup Diagnostic</title>
<style>
:root{--navy:#00126B;--yellow:#ffd21c;--muted:#61708c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#07175e}
main{max-width:760px;margin:45px auto;padding:20px}.card{background:#fff;border:1px solid #d9e1ee;border-radius:22px;padding:24px;box-shadow:0 10px 30px #00126b12}
h1{margin-top:0}.sub{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
input{padding:15px;border:1px solid #c9d4e5;border-radius:12px;font-size:16px}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:16px;cursor:pointer}
.stage{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f6f8fc;line-height:1.45;word-break:break-word}
.pass{background:#edf9f0;color:#087b32}.fail{background:#fff0f0;color:#a51d1d}.run{background:#fff9df;color:#6d5800}
small{display:block;margin-top:16px;color:var(--muted)}
</style></head>
<body><main><div class="card">
<h1>Rinse & Shine Lookup Diagnostic 🔦</h1>
<p class="sub">Standalone only. No Firebase. This version shows exactly which free service succeeds or fails.</p>
<div class="row"><input id="road" value="Coveham Crescent"><input id="area" value="KT11"></div>
<button id="go">RUN 3-STAGE TEST</button>
<div id="s1" class="stage">1. Postcodes.io — waiting</div>
<div id="s2" class="stage">2. Nominatim — waiting</div>
<div id="s3" class="stage">3. Overpass — waiting</div>
<small>Screenshot all three result boxes and send them back to ChatGPT.</small>
</div></main>
<script>
const $=id=>document.getElementById(id);
function set(id,cls,msg){const e=$(id);e.className="stage "+cls;e.textContent=msg}
async function timedJSON(url,ms){
 const c=new AbortController(), t=setTimeout(()=>c.abort("Rinse & Shine timeout after "+ms+"ms"),ms);
 try{
   const r=await fetch(url,{signal:c.signal,cache:"no-store"});
   if(!r.ok) throw new Error("HTTP "+r.status);
   return await r.json();
 } finally {clearTimeout(t)}
}
function err(e){return e?.message || String(e)}
$("go").onclick=async()=>{
 const road=$("road").value.trim(), area=$("area").value.trim().toUpperCase().replace(/\s+/g," ");
 const outcode=area.split(" ")[0];
 set("s1","run","1. Postcodes.io — RUNNING…");
 set("s2","","2. Nominatim — waiting");
 set("s3","","3. Overpass — waiting");

 let pc;
 try{
   pc=await timedJSON("https://api.postcodes.io/outcodes/"+encodeURIComponent(outcode),20000);
   if(!pc?.result) throw new Error("No result returned");
   set("s1","pass",`1. Postcodes.io — PASS ✓\n${outcode}: ${pc.result.latitude}, ${pc.result.longitude}`);
 }catch(e){
   set("s1","fail","1. Postcodes.io — FAIL ✗\n"+err(e));
   set("s2","","2. Nominatim — not run");
   set("s3","","3. Overpass — not run");
   return;
 }

 set("s2","run","2. Nominatim — RUNNING…");
 let found;
 try{
   const q=encodeURIComponent(`${road}, ${area}, UK`);
   const nom=await timedJSON("https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=gb&q="+q,20000);
   found=(nom||[]).find(x=>(x.display_name||"").toLowerCase().includes(road.toLowerCase())) || (nom||[])[0];
   if(!found) throw new Error("No matching road returned");
   set("s2","pass","2. Nominatim — PASS ✓\n"+found.display_name);
 }catch(e){
   set("s2","fail","2. Nominatim — FAIL ✗\n"+err(e));
   set("s3","","3. Overpass — not run");
   return;
 }

 set("s3","run","3. Overpass — RUNNING…");
 try{
   const safe=road.replace(/\\/g,"\\\\").replace(/"/g,'\\"');
   const q=`[out:json][timeout:15];nwr(around:2500,${found.lat},${found.lon})["addr:street"="${safe}"]["addr:housenumber"];out tags;`;
   const ov=await timedJSON("https://overpass.kumi.systems/api/interpreter?data="+encodeURIComponent(q),25000);
   const nums=[...new Set((ov.elements||[]).map(x=>x.tags?.["addr:housenumber"]).filter(Boolean))];
   nums.sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)||String(a).localeCompare(String(b),undefined,{numeric:true}));
   if(nums.length) set("s3","pass",`3. Overpass — PASS ✓\nReturned ${nums.length} identifiers:\n${nums.join(", ")}`);
   else set("s3","fail","3. Overpass — RESPONDED, BUT ZERO HOUSE IDENTIFIERS\nThe connection works; this dataset simply has no usable addr:housenumber entries for this road.");
 }catch(e){
   set("s3","fail","3. Overpass — FAIL ✗\n"+err(e));
 }
};
</script></body></html>
