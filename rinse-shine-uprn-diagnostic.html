<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rinse & Shine — UPRN Diagnostic</title>
<style>
:root{--navy:#00126B;--yellow:#ffd21c;--muted:#61708c}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#07175e}main{max-width:780px;margin:45px auto;padding:20px}
.card{background:#fff;border:1px solid #d9e1ee;border-radius:22px;padding:24px;box-shadow:0 10px 30px #00126b12}
h1{margin-top:0}.sub{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
input{padding:15px;border:1px solid #c9d4e5;border-radius:12px;font-size:16px}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:16px}
.stage{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f6f8fc;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.pass{background:#edf9f0;color:#087b32}.fail{background:#fff0f0;color:#a51d1d}.run{background:#fff9df;color:#6d5800}
small{display:block;margin-top:16px;color:var(--muted)}
</style></head><body><main><div class="card">
<h1>Rinse & Shine UPRN Diagnostic 🏠🔦</h1>
<p class="sub">Overpass has been fired. This tests Postcodes.io → Nominatim → UPRN.org.uk only. No Firebase or app data.</p>
<div class="row"><input id="road" value="Coveham Crescent"><input id="area" value="KT11"></div>
<button id="go">RUN UPRN TEST</button>
<div id="s1" class="stage">1. Postcodes.io — waiting</div>
<div id="s2" class="stage">2. Nominatim — waiting</div>
<div id="s3" class="stage">3. UPRN.org.uk — waiting</div>
<small>When it finishes, screenshot all three boxes.</small></div></main>
<script>
const $=id=>document.getElementById(id);
function set(id,cls,msg){let e=$(id);e.className="stage "+cls;e.textContent=msg}
async function json(url,ms=20000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{let r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function em(e){return e?.name==="AbortError"?"Timed out":(e?.message||String(e))}
$("go").onclick=async()=>{
 let road=$("road").value.trim(),area=$("area").value.trim().toUpperCase().replace(/\s+/g," "),outcode=area.split(" ")[0];
 set("s1","run","1. Postcodes.io — RUNNING…");set("s2","","2. Nominatim — waiting");set("s3","","3. UPRN.org.uk — waiting");
 try{let p=await json("https://api.postcodes.io/outcodes/"+encodeURIComponent(outcode));if(!p?.result)throw Error("No result");set("s1","pass",`1. Postcodes.io — PASS ✓\n${outcode}: ${p.result.latitude}, ${p.result.longitude}`)}
 catch(e){set("s1","fail","1. Postcodes.io — FAIL ✗\n"+em(e));return}
 let found;
 set("s2","run","2. Nominatim — RUNNING…");
 try{let n=await json("https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=gb&q="+encodeURIComponent(`${road}, ${area}, UK`));found=(n||[]).find(x=>(x.display_name||"").toLowerCase().includes(road.toLowerCase()))||(n||[])[0];if(!found)throw Error("No road returned");set("s2","pass","2. Nominatim — PASS ✓\n"+found.display_name)}
 catch(e){set("s2","fail","2. Nominatim — FAIL ✗\n"+em(e));return}
 set("s3","run","3. UPRN.org.uk — RUNNING…");
 try{
   let lat=+found.lat,lon=+found.lon,d=0.0045;
   let url=`https://uprn.org.uk/uprns.json?min_lat=${lat-d}&max_lat=${lat+d}&min_lng=${lon-d}&max_lng=${lon+d}`;
   let u=await json(url,25000);
   if(!Array.isArray(u))throw Error("Unexpected response");
   let norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
   let target=norm(road);
   let addressed=u.filter(x=>x?.has_address&&x?.address?.house_identifier);
   let matches=addressed.filter(x=>norm(x?.address?.street?.name)===target);
   let ids=[...new Set(matches.map(x=>String(x.address.house_identifier).trim()).filter(Boolean))];
   ids.sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)||a.localeCompare(b,undefined,{numeric:true}));
   if(ids.length){
     set("s3","pass",`3. UPRN.org.uk — PASS ✓\nBounding box returned ${u.length} UPRNs; ${addressed.length} had community address data; ${ids.length} matched ${road}.\n\nPROPERTY IDENTIFIERS:\n${ids.join(", ")}`);
   }else{
     let streets=[...new Set(addressed.map(x=>x?.address?.street?.name).filter(Boolean))].slice(0,20);
     set("s3","fail",`3. UPRN.org.uk — RESPONDED ✓, BUT NO ${road.toUpperCase()} ADDRESSES\nBounding box returned ${u.length} UPRNs; ${addressed.length} had community address data.\n${streets.length?"Nearby contributed streets: "+streets.join(", "):"No contributed street/address details were present in this box."}`);
   }
 }catch(e){set("s3","fail","3. UPRN.org.uk — FAIL ✗\n"+em(e))}
};
</script></body></html>
