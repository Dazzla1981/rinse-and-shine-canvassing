<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rinse & Shine — UPRN Response Diagnostic</title>
<style>
:root{--navy:#00126B;--yellow:#ffd21c;--muted:#61708c}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#07175e}main{max-width:800px;margin:35px auto;padding:20px}
.card{background:#fff;border:1px solid #d9e1ee;border-radius:22px;padding:24px;box-shadow:0 10px 30px #00126b12}
h1{margin-top:0}.sub,small{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
input{padding:15px;border:1px solid #c9d4e5;border-radius:12px;font-size:16px}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:16px}
.box{margin-top:12px;padding:14px;border-radius:12px;background:#f6f8fc;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.run{background:#fff9df;color:#6d5800}.ok{background:#edf9f0;color:#087b32}.bad{background:#fff0f0;color:#a51d1d}
</style></head><body><main><div class="card">
<h1>Rinse & Shine UPRN Response Diagnostic 🕵️</h1>
<p class="sub">No Firebase. No app data. This interrogates the UPRN response instead of assuming it is JSON.</p>
<div class="row"><input id="road" value="Coveham Crescent"><input id="area" value="KT11"></div>
<button id="go">INTERROGATE UPRN RESPONSE</button>
<div id="result" class="box">Ready.</div>
<small>Screenshot the whole result box and send it back to ChatGPT.</small>
</div></main>
<script>
const out=document.getElementById("result");
const show=(cls,s)=>{out.className="box "+cls;out.textContent=s};
async function getJSON(url,ms=20000){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}
 finally{clearTimeout(t)}
}
document.getElementById("go").onclick=async()=>{
 const road=document.getElementById("road").value.trim();
 const area=document.getElementById("area").value.trim().toUpperCase();
 show("run","Finding road coordinates first…");
 try{
  const q=encodeURIComponent(`${road}, ${area}, UK`);
  const n=await getJSON("https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=gb&q="+q);
  const f=(n||[]).find(x=>(x.display_name||"").toLowerCase().includes(road.toLowerCase()))||(n||[])[0];
  if(!f)throw Error("Nominatim returned no road");
  const lat=+f.lat, lon=+f.lon, d=.0045;
  const api=`https://uprn.org.uk/uprns.json?min_lat=${lat-d}&max_lat=${lat+d}&min_lng=${lon-d}&max_lng=${lon+d}`;
  show("run","Road found ✓\n\nRequesting:\n"+api+"\n\nWaiting for raw response…");
  const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);
  let r;
  try{r=await fetch(api,{signal:c.signal,cache:"no-store",redirect:"follow"})}finally{clearTimeout(t)}
  const body=await r.text();
  const ct=r.headers.get("content-type")||"(none)";
  const preview=body.slice(0,1200).replace(/\s+/g," ").trim();
  let parsed="NO";
  try{JSON.parse(body);parsed="YES"}catch(e){}
  show(parsed==="YES"?"ok":"bad",
`ROAD ✓
${f.display_name}

UPRN HTTP STATUS: ${r.status} ${r.statusText}
FINAL URL: ${r.url}
CONTENT-TYPE: ${ct}
REDIRECTED: ${r.redirected}
VALID JSON: ${parsed}
BODY LENGTH: ${body.length}

FIRST 1200 CHARACTERS:
${preview || "(empty response)"}`);
 }catch(e){
  show("bad","TEST FAILED\n"+(e?.name==="AbortError"?"Timed out waiting for response":(e?.message||String(e))));
 }
};
</script></body></html>
