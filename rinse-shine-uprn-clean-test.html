<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rinse & Shine — Clean UPRN Test</title>
<style>
:root{--navy:#00126B;--yellow:#ffd21c;--muted:#61708c}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#07175e}main{max-width:800px;margin:35px auto;padding:20px}
.card{background:#fff;border:1px solid #d9e1ee;border-radius:22px;padding:24px;box-shadow:0 10px 30px #00126b12}
h1{margin-top:0}.sub,small{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
input{padding:15px;border:1px solid #c9d4e5;border-radius:12px;font-size:16px}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:16px}
.box{margin-top:12px;padding:14px;border-radius:12px;background:#f6f8fc;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.run{background:#fff9df;color:#6d5800}.ok{background:#edf9f0;color:#087b32}.bad{background:#fff0f0;color:#a51d1d}
</style></head><body><main><div class="card">
<h1>Rinse & Shine Clean UPRN Test 🧹🔦</h1>
<p class="sub">This page first unregisters any Rinse & Shine service worker, then tests UPRN directly. No Firebase. No customer/app data.</p>
<div class="row"><input id="road" value="Coveham Crescent"><input id="area" value="KT11"></div>
<button id="go">CLEAN UP & TEST UPRN</button>
<div id="result" class="box">Ready.</div>
<small>After this test, reopening the main canvassing app will allow its service worker to register again.</small>
</div></main>
<script>
const out=document.getElementById("result");
const show=(c,s)=>{out.className="box "+c;out.textContent=s};
async function j(url,ms=20000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{let r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
document.getElementById("go").onclick=async()=>{
 const road=document.getElementById("road").value.trim(), area=document.getElementById("area").value.trim().toUpperCase();
 show("run","1/3 Removing service-worker control and caches…");
 try{
   let regs=await navigator.serviceWorker.getRegistrations();
   let removed=0;
   for(const reg of regs){
     if(reg.scope.includes("/rinse-and-shine-canvassing/")){ if(await reg.unregister()) removed++; }
   }
   let keys=await caches.keys(), deleted=0;
   for(const k of keys){ if(await caches.delete(k)) deleted++; }
   show("run",`1/3 Cleanup complete ✓\nUnregistered ${removed} service worker(s); cleared ${deleted} cache(s).\n\n2/3 Finding ${road}…`);
   const n=await j("https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=gb&q="+encodeURIComponent(`${road}, ${area}, UK`));
   const f=(n||[]).find(x=>(x.display_name||"").toLowerCase().includes(road.toLowerCase()))||(n||[])[0];
   if(!f)throw Error("Nominatim returned no road");
   const lat=+f.lat,lon=+f.lon,d=.0045;
   const api=`https://uprn.org.uk/uprns.json?min_lat=${lat-d}&max_lat=${lat+d}&min_lng=${lon-d}&max_lng=${lon+d}`;
   show("run",`1/3 Cleanup complete ✓\n2/3 Road found ✓\n${f.display_name}\n\n3/3 Fetching UPRN directly…`);
   let c=new AbortController(),t=setTimeout(()=>c.abort(),25000),r;
   try{r=await fetch(api,{signal:c.signal,cache:"no-store",redirect:"follow"})}finally{clearTimeout(t)}
   const body=await r.text(),ct=r.headers.get("content-type")||"(none)";
   let data=null,valid=false;try{data=JSON.parse(body);valid=true}catch(e){}
   let msg=`SERVICE WORKER CLEANUP ✓\nROAD ✓\n\nUPRN STATUS: ${r.status} ${r.statusText}\nFINAL URL: ${r.url}\nCONTENT-TYPE: ${ct}\nREDIRECTED: ${r.redirected}\nVALID JSON: ${valid?"YES":"NO"}\nBODY LENGTH: ${body.length}`;
   if(valid){
     const count=Array.isArray(data)?data.length:"JSON returned (not an array)";
     msg+=`\nUPRN RESULT COUNT: ${count}\n\nFIRST JSON:\n${JSON.stringify(Array.isArray(data)?data.slice(0,3):data,null,2).slice(0,1800)}`;
     show("ok",msg);
   }else{
     msg+=`\n\nFIRST 1200 CHARACTERS:\n${body.slice(0,1200).replace(/\s+/g," ").trim()||"(empty)"}`;
     show("bad",msg);
   }
 }catch(e){show("bad","TEST FAILED\n"+(e?.name==="AbortError"?"Timed out waiting for response":(e?.message||String(e))))}
};
</script></body></html>
